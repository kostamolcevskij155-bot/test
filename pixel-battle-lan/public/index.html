<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pixel Battle LAN</title>
  <link rel="stylesheet" href="/style.css" />
  <!-- Иконка-«пиксель» встроена прямо в HTML (data-URI), без внешних файлов -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='8' height='8' fill='%23ff4500'/%3E%3Crect x='8' width='8' height='8' fill='%2300d3dd'/%3E%3Crect y='8' width='8' height='8' fill='%23e5d900'/%3E%3Crect x='8' y='8' width='8' height='8' fill='%2302be01'/%3E%3C/svg%3E" />
</head>
<body>

  <!-- ======== ШАПКА / HUD ======== -->
  <header class="hud">
    <div class="hud-logo">
      <svg class="hud-logo-icon" viewBox="0 0 16 16" aria-hidden="true">
        <rect width="8" height="8" fill="#ff4500"/><rect x="8" width="8" height="8" fill="#00d3dd"/>
        <rect y="8" width="8" height="8" fill="#e5d900"/><rect x="8" y="8" width="8" height="8" fill="#02be01"/>
      </svg>
      <span class="hud-title">PIXEL&nbsp;BATTLE</span>
      <span class="hud-badge">LAN</span>
    </div>

    <div class="hud-center">
      <label class="hud-nick" title="Ваш ник (виден в ленте событий)">
        <span class="hud-label">ник</span>
        <input id="nick" type="text" maxlength="24" placeholder="аноним" autocomplete="off" />
      </label>
    </div>

    <div class="hud-stats">
      <div class="chip" id="online-chip" title="Игроков онлайн">
        <span class="dot dot-live"></span><span id="online-count">—</span>
      </div>
      <div class="chip" title="Всего закрашено пикселей">
        <svg class="chip-ico" viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6"/><rect x="9" y="1" width="6" height="6"/><rect x="1" y="9" width="6" height="6"/><rect x="9" y="9" width="6" height="6"/></svg>
        <span id="pixels-count">0</span>
      </div>
      <div class="chip chip-coords" id="coords-chip" title="Координаты курсора">— : —</div>
      <button class="chip chip-btn" id="sound-btn" title="Звук вкл/выкл (M)">
        <svg id="sound-on-ico" viewBox="0 0 16 16"><path d="M2 6h3l4-3v10L5 10H2z"/><path d="M11 5c1.5 1.5 1.5 4.5 0 6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        <svg id="sound-off-ico" viewBox="0 0 16 16" hidden><path d="M2 6h3l4-3v10L5 10H2z"/><path d="M11 6l4 4m0-4l-4 4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <button class="chip chip-btn" id="save-btn" title="Скачать холст как PNG">
        <svg viewBox="0 0 16 16"><path d="M8 2v8m0 0L5 7m3 3l3-3M3 13h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <!-- ======== ХОЛСТ ======== -->
  <main id="board-wrap">
    <canvas id="board"></canvas>

    <!-- Лента последних событий -->
    <ul id="feed" class="feed" aria-live="polite"></ul>

    <!-- Кнопки зума (удобно на телефоне) -->
    <div class="zoomer">
      <button id="zoom-in"  title="Приблизить (+)">+</button>
      <button id="zoom-out" title="Отдалить (−)">−</button>
      <button id="zoom-fit" title="Показать весь холст (Home)">⌂</button>
    </div>

    <!-- Экран загрузки при подключении -->
    <div id="splash" class="splash">
      <div class="splash-box">
        <div class="splash-title">PIXEL BATTLE</div>
        <div class="splash-sub" id="splash-status">Подключение к серверу…</div>
        <div class="splash-bar"><div class="splash-bar-fill" id="splash-fill"></div></div>
      </div>
    </div>
  </main>

  <!-- ======== НИЖНЯЯ ПАНЕЛЬ: кулдаун + палитра + оверлей ======== -->
  <footer class="dock">
    <!-- Полоса кулдауна -->
    <div class="cooldown" id="cooldown" title="Кулдаун между пикселями">
      <div class="cooldown-fill" id="cooldown-fill"></div>
      <span class="cooldown-text" id="cooldown-text">готово</span>
    </div>

    <div class="dock-row">
      <!-- Палитра (заполняется из client.js) -->
      <div id="palette" class="palette" role="toolbar" aria-label="Палитра цветов"></div>

      <!-- Управление оверлеем -->
      <div class="overlay-panel" id="overlay-panel">
        <button id="overlay-btn" class="btn" title="Загрузить картинку-образец поверх холста (O)">
          <svg viewBox="0 0 16 16"><path d="M2 12l3.5-4 2.5 3 2-2.5L14 12z"/><circle cx="5.5" cy="5" r="1.5"/></svg>
          оверлей
        </button>
        <input type="file" id="overlay-file" accept="image/*" hidden />

        <label class="overlay-opacity" id="overlay-opacity" title="Прозрачность оверлея">
          <input type="range" id="overlay-range" min="10" max="90" value="45" />
        </label>

        <button id="overlay-toggle" class="btn btn-ghost" title="Показать/скрыть оверлей" disabled>скрыть</button>
        <button id="overlay-clear" class="btn btn-ghost" title="Убрать оверлей" disabled>убрать</button>
      </div>
    </div>
  </footer>

  <!-- Socket.IO отдаёт клиентскую библиотеку САМ, со своего сервера —
       внешний CDN не нужен -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>
</html>
